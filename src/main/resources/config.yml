# ============================================
#   Questions bonus dans le chat (/sendquestion)
# ============================================
# Pose automatiquement une question (calcul mental facile/moyen/difficile, ou
# capitale <-> pays) dans le chat public toutes les "interval-minutes"
# minutes. Le premier joueur à répondre juste dans le chat gagne de l'argent
# (via Vault) : le gain dépend de la difficulté ET de la rapidité de la
# réponse, borné entre min-reward et max-reward.
# LeGameurPSN_YT (ou un op) peut forcer une question en avance avec /sendquestion.
trivia:
  enabled: true
  interval-minutes: 9
  min-reward: 1
  max-reward: 5000
  # Nombre de dernières questions mémorisées pour éviter qu'une même question ne retombe deux fois de suite
  anti-repeat-count: 15
  # Si true, une mauvaise réponse (message pendant une question active qui ne correspond pas) casse la série
  track-wrong-answers: true
  # Bonus de gain par bonne réponse d'affilée (en %), plafonné par streak-bonus-max-percent
  streak-bonus-percent: 5
  streak-bonus-max-percent: 50

# ============================================
#   Bornes de la commande /eco (admin)
# ============================================
eco:
  min-amount: 1
  max-amount: 5000
